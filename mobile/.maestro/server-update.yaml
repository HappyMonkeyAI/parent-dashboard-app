- launchApp:
    clearState: true
- tapOn: "Email"
- inputText: "no-account@example.invalid"
- tapOn: "Password"
- inputText: "not-a-real-password"
- tapOn:
    text: "Log in"
    index: 1
- assertVisible: "The app server needs the mobile update before you can log in."
